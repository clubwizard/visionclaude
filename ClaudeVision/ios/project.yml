name: ClaudeVision
options:
  bundleIdPrefix: com.claudevision
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.5.0"

targets:
  ClaudeVision:
    type: application
    platform: iOS
    sources:
      - ClaudeVision
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
    settings:
      base:
        INFOPLIST_FILE: ClaudeVision/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Bundle id stays as com.claudevision.app because the Meta DAT SDK
        # MetaAppID / ClientToken in Info.plist is registered against it. The
        # user-facing app name ("Aside") is controlled via CFBundleDisplayName.
        PRODUCT_BUNDLE_IDENTIFIER: com.claudevision.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # DEVELOPMENT_TEAM: your 10-character Apple Team ID. Free Apple ID:
        # leave blank, then in Xcode set "Team" under Signing & Capabilities
        # to your "Personal Team". Paid Developer Program: paste team id here
        # so xcodegen-generated projects work non-interactively. See ios/README.md.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClaudeVision:
    build:
      targets:
        ClaudeVision: all
    run:
      config: Debug
