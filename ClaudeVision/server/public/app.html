<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aside — Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F4EFE5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter Tight', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #status {
      font-size: 13px;
      color: #7B7468;
      margin-bottom: 32px;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #preview-wrap {
      width: 240px;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      background: #1A1714;
      border: 1px solid #D9D1C0;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #preview.env { transform: none; }
    #preview-placeholder {
      color: #7B7468;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      padding: 0 16px;
    }
    #vision-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(26,23,20,0.6);
      color: #6FE3A8;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 999px;
    }
    #vision-badge.off { color: #7B7468; }
    #vision-badge.err { color: #E89A6B; }
    #vision-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      color: #7B7468;
      user-select: none;
    }
    #vision-toggle { width: 16px; height: 16px; accent-color: #6FE3A8; cursor: pointer; }
    #vision-toggle-row label { cursor: pointer; }
    #voice-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      color: #7B7468;
    }
    #voice-select {
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      color: #4A4540;
      background: #FFFDF8;
      border: 1px solid #D9D1C0;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }
    #vision-status {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #7B7468;
      margin: -16px 0 24px;
      min-height: 18px;
      max-width: 360px;
      text-align: center;
      padding: 0 16px;
    }
    #vision-status.err { color: #C25A2B; }
    #vision-status.ok { color: #2F8A57; }
    #talk {
      width: 120px;
      height: 120px;
      border-radius: 999px;
      border: none;
      background: #6FE3A8;
      color: #1A1714;
      font-family: 'Inter Tight', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 10px 30px -12px #6FE3A8;
    }
    #talk:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px #6FE3A8; }
    #talk:active { transform: scale(0.96); }
    #talk.listening {
      background: #1A1714;
      color: #6FE3A8;
      box-shadow: 0 10px 30px -12px #1A1714;
    }
    #response {
      margin-top: 40px;
      max-width: 380px;
      text-align: center;
      font-size: 16px;
      line-height: 1.55;
      color: #1A1714;
      min-height: 48px;
      padding: 0 24px;
    }
    #logout, #diag-open {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      background: transparent;
      border: 1px solid #D9D1C0;
      color: #7B7468;
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    #logout { right: 24px; }
    #diag-open { right: 116px; }
    #logout:hover, #diag-open:hover { border-color: #7B7468; }
    #diag-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,23,20,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    #diag-overlay.open { display: flex; }
    #diag-panel {
      background: #F4EFE5;
      border: 1px solid #D9D1C0;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #diag-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #D9D1C0;
    }
    #diag-header h2 {
      font-size: 14px;
      font-weight: 600;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1A1714;
    }
    #diag-list {
      overflow-y: auto;
      padding: 8px 0;
      flex: 1;
    }
    .diag-row {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(217,209,192,0.5);
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 10px;
      align-items: start;
    }
    .diag-row:last-child { border-bottom: none; }
    .diag-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 5px;
    }
    .diag-dot.ok { background: #2F8A57; }
    .diag-dot.err { background: #C25A2B; }
    .diag-dot.unk { background: #A39A8C; }
    .diag-label {
      font-size: 13px;
      font-weight: 600;
      color: #1A1714;
    }
    .diag-detail {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: #7B7468;
      margin-top: 3px;
      word-break: break-all;
    }
    #diag-footer {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid #D9D1C0;
    }
    #diag-footer button {
      flex: 1;
      background: transparent;
      border: 1px solid #D9D1C0;
      color: #1A1714;
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    #diag-footer button.primary { background: #1A1714; color: #6FE3A8; border-color: #1A1714; }
  </style>
</head>
<body>
  <button id="diag-open">Diagnostics</button>
  <button id="logout">Log out</button>

  <div id="diag-overlay" role="dialog" aria-modal="true">
    <div id="diag-panel">
      <div id="diag-header">
        <h2>Diagnostics</h2>
        <button id="diag-close" style="background:transparent;border:none;color:#7B7468;font-size:20px;cursor:pointer;line-height:1;padding:4px 8px">×</button>
      </div>
      <div id="diag-list"></div>
      <div id="diag-footer">
        <button id="diag-tone">Test tone</button>
        <button id="diag-tts">Test TTS</button>
        <button id="diag-refresh">Re-run</button>
        <button id="diag-copy" class="primary">Copy</button>
      </div>
    </div>
  </div>

  <div id="preview-wrap">
    <video id="preview" autoplay playsinline muted></video>
    <div id="preview-placeholder">Tap Talk to enable camera</div>
    <div id="vision-badge" class="off">Vision off</div>
  </div>
  <div id="vision-toggle-row">
    <input type="checkbox" id="vision-toggle" checked />
    <label for="vision-toggle">Send camera frames to Claude</label>
  </div>
  <div id="voice-row">
    <label for="voice-select">Voice</label>
    <select id="voice-select">
      <optgroup label="Female">
        <option value="aura-asteria-en">Asteria · US</option>
        <option value="aura-luna-en">Luna · US</option>
        <option value="aura-stella-en">Stella · US</option>
        <option value="aura-athena-en">Athena · UK</option>
        <option value="aura-hera-en">Hera · US</option>
      </optgroup>
      <optgroup label="Male">
        <option value="aura-orion-en">Orion · US</option>
        <option value="aura-arcas-en">Arcas · US</option>
        <option value="aura-perseus-en">Perseus · US</option>
        <option value="aura-angus-en">Angus · IE</option>
        <option value="aura-orpheus-en">Orpheus · US</option>
        <option value="aura-helios-en">Helios · UK</option>
        <option value="aura-zeus-en">Zeus · US</option>
      </optgroup>
    </select>
  </div>
  <canvas id="snap" hidden></canvas>
  <div id="vision-status"></div>
  <div id="status">Ready</div>
  <button id="talk">Talk</button>
  <div id="response"></div>

  <script>
    const CONVERSATION_KEY = 'aside_conversation_id';
    let conversationId = sessionStorage.getItem(CONVERSATION_KEY);
    let recognition = null;
    let isListening = false;
    let videoStream = null;
    let usingFacingMode = 'environment';
    let cameraReadyPromise = null;

    const status = document.getElementById('status');
    const talkBtn = document.getElementById('talk');
    const responseEl = document.getElementById('response');
    const previewEl = document.getElementById('preview');
    const placeholderEl = document.getElementById('preview-placeholder');
    const visionBadge = document.getElementById('vision-badge');
    const visionStatus = document.getElementById('vision-status');
    const visionToggle = document.getElementById('vision-toggle');

    const VISION_KEY = 'aside_vision_enabled';
    visionToggle.checked = localStorage.getItem(VISION_KEY) !== '0';
    function visionEnabled() { return visionToggle.checked; }

    const voiceSelect = document.getElementById('voice-select');
    const VOICE_KEY = 'aside_voice';
    const DEFAULT_VOICE = 'aura-asteria-en';
    const savedVoice = localStorage.getItem(VOICE_KEY);
    if (savedVoice && [...voiceSelect.options].some(o => o.value === savedVoice)) {
      voiceSelect.value = savedVoice;
    }
    voiceSelect.addEventListener('change', () => {
      localStorage.setItem(VOICE_KEY, voiceSelect.value);
    });
    function selectedVoice() { return voiceSelect.value || DEFAULT_VOICE; }

    function setVisionStatus(text, kind /* 'ok' | 'err' | '' */) {
      visionStatus.textContent = text;
      visionStatus.classList.toggle('err', kind === 'err');
      visionStatus.classList.toggle('ok', kind === 'ok');
    }

    function explainCameraError(err) {
      const name = err?.name || '';
      const msg = err?.message || '';
      if (name === 'NotAllowedError') {
        // Could be a user denial OR a Permissions-Policy header (Plesk default)
        if (/permission|policy/i.test(msg)) return 'Camera blocked by site policy (Permissions-Policy header)';
        return 'Camera permission denied — allow it in browser site settings';
      }
      if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'No camera found on this device';
      if (name === 'NotReadableError') return 'Camera is in use by another app';
      if (name === 'SecurityError') return 'Browser blocked the camera (insecure context?)';
      return `Camera error: ${name || msg || 'unknown'}`;
    }

    // Pre-flight: surface obvious blockers before the user taps Talk
    if (!window.isSecureContext) {
      setVisionStatus('HTTPS required for camera — voice only over plain HTTP', 'err');
      visionBadge.textContent = 'Voice only';
      visionBadge.classList.add('err');
      placeholderEl.textContent = 'HTTPS required';
    } else if (!navigator.mediaDevices?.getUserMedia) {
      setVisionStatus('Browser does not expose getUserMedia — voice only', 'err');
      visionBadge.textContent = 'Voice only';
      visionBadge.classList.add('err');
      placeholderEl.textContent = 'Not supported';
    }

    function streamIsLive(stream) {
      const track = stream?.getVideoTracks?.()[0];
      if (!track) return false;
      if (track.readyState !== 'live') return false;
      // `active` is false once all tracks have ended on most browsers
      if (stream.active === false) return false;
      return true;
    }

    function teardownStream() {
      try { videoStream?.getTracks().forEach(t => t.stop()); } catch {}
      videoStream = null;
      try { previewEl.srcObject = null; } catch {}
    }

    function awaitVideoReady(video, timeoutMs = 3000) {
      // Resolve once the <video> reports non-zero dimensions, so the first
      // captureFrame() call doesn't draw a 0x0 canvas. iOS Safari fires
      // loadedmetadata after attaching srcObject; without this the first
      // utterance after enabling the camera silently goes text-only.
      return new Promise((resolve) => {
        if (video.videoWidth > 0 && video.videoHeight > 0) return resolve(true);
        let settled = false;
        const finish = (ok) => {
          if (settled) return;
          settled = true;
          video.removeEventListener('loadedmetadata', onMeta);
          video.removeEventListener('loadeddata', onMeta);
          clearTimeout(timer);
          resolve(ok);
        };
        const onMeta = () => { if (video.videoWidth > 0 && video.videoHeight > 0) finish(true); };
        video.addEventListener('loadedmetadata', onMeta);
        video.addEventListener('loadeddata', onMeta);
        const timer = setTimeout(() => finish(false), timeoutMs);
      });
    }

    function handleTrackEnded() {
      // Track died mid-session (backgrounding, another app grabbed the camera,
      // user pulled down Control Center). Drop the stale stream so the next
      // ensureCamera() call reacquires instead of returning a dead handle.
      teardownStream();
      visionBadge.textContent = 'Vision lost';
      visionBadge.classList.add('off', 'err');
      placeholderEl.style.display = '';
      placeholderEl.textContent = 'Camera stopped — tap Talk to retry';
      setVisionStatus('Camera stream ended — will retry on next tap', 'err');
    }

    async function ensureCamera() {
      // User opted out — keep the camera fully off.
      if (!visionEnabled()) return false;
      // Stale stream check: cached track may have ended while backgrounded.
      if (videoStream && !streamIsLive(videoStream)) teardownStream();
      if (videoStream) return true;
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return false;
      // Try rear camera first, fall back to whatever's available (front, laptop webcam)
      const attempts = [
        { video: { facingMode: { exact: 'environment' } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false },
      ];
      let lastErr = null;
      for (const constraints of attempts) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia(constraints);
          previewEl.srcObject = videoStream;
          const track = videoStream.getVideoTracks()[0];
          track?.addEventListener('ended', handleTrackEnded);
          const ready = await awaitVideoReady(previewEl, 3000);
          const settings = track?.getSettings?.() || {};
          usingFacingMode = settings.facingMode || 'environment';
          // Front-facing cameras look natural mirrored; rear should not be mirrored
          previewEl.classList.toggle('env', usingFacingMode === 'environment');
          placeholderEl.style.display = 'none';
          visionBadge.textContent = usingFacingMode === 'environment' ? 'Vision on' : 'Vision on · front';
          visionBadge.classList.remove('off');
          visionBadge.classList.remove('err');
          if (ready) {
            setVisionStatus(`Vision on · ${usingFacingMode} camera`, 'ok');
          } else {
            setVisionStatus('Camera open but metadata not ready yet — first frame may be skipped', 'err');
          }
          return true;
        } catch (err) {
          lastErr = err;
          console.warn('[camera] attempt failed', constraints, err.name, err.message);
        }
      }
      const reason = explainCameraError(lastErr);
      placeholderEl.textContent = 'Voice only';
      visionBadge.textContent = 'Voice only';
      visionBadge.classList.add('err');
      setVisionStatus(reason, 'err');
      return false;
    }

    function captureFrame() {
      if (!streamIsLive(videoStream)) {
        console.warn('[camera] capture skipped — stream not live');
        return null;
      }
      if (!previewEl.videoWidth || !previewEl.videoHeight) {
        console.warn('[camera] capture skipped — video dimensions not ready');
        return null;
      }
      const canvas = document.getElementById('snap');
      // Cap longest edge at 1280 to keep payloads small
      const maxEdge = 1280;
      const scale = Math.min(1, maxEdge / Math.max(previewEl.videoWidth, previewEl.videoHeight));
      canvas.width = Math.round(previewEl.videoWidth * scale);
      canvas.height = Math.round(previewEl.videoHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(previewEl, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return dataUrl.replace(/^data:image\/jpeg;base64,/, '');
    }

    visionToggle.addEventListener('change', () => {
      localStorage.setItem(VISION_KEY, visionToggle.checked ? '1' : '0');
      if (visionToggle.checked) {
        placeholderEl.textContent = 'Tap Talk to enable camera';
        placeholderEl.style.display = '';
        visionBadge.textContent = 'Vision off';
        visionBadge.classList.add('off');
        visionBadge.classList.remove('err');
        setVisionStatus('', '');
      } else {
        teardownStream();
        placeholderEl.textContent = 'Camera disabled';
        placeholderEl.style.display = '';
        visionBadge.textContent = 'Vision disabled';
        visionBadge.classList.add('off');
        visionBadge.classList.remove('err');
        setVisionStatus('Camera disabled — chat will be voice only', '');
      }
    });

    // Apply initial toggle state (in case the user opted out previously)
    if (!visionEnabled()) {
      placeholderEl.textContent = 'Camera disabled';
      visionBadge.textContent = 'Vision disabled';
      setVisionStatus('Camera disabled — chat will be voice only', '');
    }

    // Session check on load
    fetch('/auth/check')
      .then(r => r.json())
      .then(d => { if (!d.authenticated) window.location.href = '/'; });

    // Logout
    document.getElementById('logout').onclick = () => {
      fetch('/auth/logout', { method: 'POST' })
        .then(() => { window.location.href = '/'; });
    };

    let lastChat = null;

    async function sendToClaude(text, imageBase64) {
      status.textContent = 'Thinking…';
      const body = { text, conversation_id: conversationId || undefined };
      if (imageBase64) body.images = [imageBase64];
      const t0 = performance.now();
      let res, data, err;
      try {
        res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        data = await res.json();
      } catch (e) {
        err = e;
      }
      const ms = Math.round(performance.now() - t0);
      lastChat = {
        ok: !!res?.ok,
        status: res?.status ?? 0,
        ms,
        replyLen: (data?.text || '').length,
        toolCalls: data?.tool_calls?.length || 0,
        hadImage: !!imageBase64,
        imageBytes: imageBase64 ? Math.round(imageBase64.length * 0.75) : 0,
        error: err ? String(err) : (data?.error || null),
      };
      if (err) throw err;
      if (data?.conversation_id) {
        conversationId = data.conversation_id;
        sessionStorage.setItem(CONVERSATION_KEY, conversationId);
      }
      return data?.text || '';
    }

    async function speak(text) {
      // Try Deepgram Aura TTS first
      try {
        const res = await fetch('/voice/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: selectedVoice() }),
        });
        if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.onended = () => URL.revokeObjectURL(url);
          await audio.play();
          return;
        }
      } catch { /* fall through to browser TTS */ }
      // Browser SpeechSynthesis fallback
      const utt = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(utt);
    }

    function startListening() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        status.textContent = 'Speech not supported — try Chrome or Safari';
        return;
      }
      recognition = new SR();
      recognition.lang = 'en-GB';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        talkBtn.textContent = 'Listening…';
        talkBtn.classList.add('listening');
        status.textContent = 'Listening';
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        status.textContent = `You: ${transcript}`;
        talkBtn.textContent = 'Talk';
        talkBtn.classList.remove('listening');
        // Wait for the in-flight ensureCamera() (if any) so the first utterance
        // after enabling the camera doesn't capture before loadedmetadata fires.
        if (cameraReadyPromise) { try { await cameraReadyPromise; } catch {} }
        const frame = captureFrame();
        try {
          const reply = await sendToClaude(transcript, frame);
          responseEl.textContent = reply;
          status.textContent = 'Ready';
          await speak(reply);
        } catch {
          status.textContent = 'Error — try again';
        }
      };

      recognition.onerror = (e) => {
        status.textContent = `Error: ${e.error}`;
        isListening = false;
        talkBtn.textContent = 'Talk';
        talkBtn.classList.remove('listening');
      };

      recognition.onend = () => {
        isListening = false;
        talkBtn.textContent = 'Talk';
        talkBtn.classList.remove('listening');
      };

      recognition.start();
    }

    talkBtn.onclick = async () => {
      if (isListening) {
        recognition?.stop();
        return;
      }
      // Request camera inside the user gesture (required by iOS Safari).
      // Track the promise so onresult can await it before captureFrame().
      cameraReadyPromise = ensureCamera().finally(() => { cameraReadyPromise = null; });
      startListening();
    };

    // ── Diagnostics panel ──────────────────────────────────────────────
    const diagOverlay = document.getElementById('diag-overlay');
    const diagList = document.getElementById('diag-list');
    let lastDiagRows = [];

    function renderDiag(rows) {
      lastDiagRows = rows;
      diagList.innerHTML = '';
      for (const [label, state, detail] of rows) {
        const row = document.createElement('div');
        row.className = 'diag-row';
        const dot = document.createElement('div');
        dot.className = 'diag-dot ' + (state === true ? 'ok' : state === false ? 'err' : 'unk');
        const body = document.createElement('div');
        const l = document.createElement('div'); l.className = 'diag-label'; l.textContent = label;
        const d = document.createElement('div'); d.className = 'diag-detail'; d.textContent = detail || '';
        body.appendChild(l); if (detail) body.appendChild(d);
        row.appendChild(dot); row.appendChild(body);
        diagList.appendChild(row);
      }
    }

    async function runDiagnostics() {
      const rows = [];
      rows.push(['Secure context (HTTPS)', window.isSecureContext, window.location.protocol + '//' + window.location.host]);
      rows.push(['getUserMedia available', !!navigator.mediaDevices?.getUserMedia,
        navigator.mediaDevices?.getUserMedia ? 'yes' : 'no — browser does not expose it']);
      rows.push(['SpeechRecognition available',
        !!(window.SpeechRecognition || window.webkitSpeechRecognition),
        (window.SpeechRecognition || window.webkitSpeechRecognition) ? 'yes (webkit/standard)' : 'no — try Chrome or Safari']);

      // Permissions API
      if (navigator.permissions?.query) {
        for (const name of ['camera', 'microphone']) {
          try {
            const r = await navigator.permissions.query({ name });
            rows.push([`Permission · ${name}`, r.state === 'granted', r.state]);
          } catch {
            rows.push([`Permission · ${name}`, null, 'query not supported']);
          }
        }
      } else {
        rows.push(['Permissions API', null, 'not exposed by this browser']);
      }

      // Active camera stream
      if (videoStream) {
        const track = videoStream.getVideoTracks()[0];
        const s = track?.getSettings?.() || {};
        rows.push(['Camera stream', track?.readyState === 'live',
          `${s.width || '?'}×${s.height || '?'} · facing ${s.facingMode || '?'} · ${track?.label || 'no label'}`]);
      } else {
        rows.push(['Camera stream', false, 'not started — tap Talk once to start']);
      }

      // Permissions-Policy header on a real backend request (catches Plesk default headers)
      try {
        const r = await fetch('/health', { cache: 'no-store' });
        const pp = r.headers.get('Permissions-Policy');
        const fp = r.headers.get('Feature-Policy');
        const policy = pp || fp;
        const blocksCamera = policy ? /camera\s*=\s*\(\s*\)/i.test(policy) : false;
        rows.push(['Permissions-Policy header', !blocksCamera, policy ? policy : 'not set (good)']);
      } catch (e) {
        rows.push(['Permissions-Policy header', null, 'could not read — ' + e.message]);
      }

      // Health
      try {
        const r = await fetch('/health', { cache: 'no-store' });
        const j = await r.json();
        const servers = j.mcp?.servers?.length ?? 0;
        const tools = j.mcp?.totalTools ?? 0;
        const skills = j.skills?.count ?? 0;
        const upMin = Math.round((j.uptime || 0) / 60);
        rows.push(['Backend /health', j.status === 'ok',
          `up ${upMin}m · MCP servers=${servers} · tools=${tools} · skills=${skills} · convs=${j.conversations ?? 0}`]);
      } catch (e) {
        rows.push(['Backend /health', false, 'fetch failed — ' + e.message]);
      }

      // Auth
      try {
        const r = await fetch('/auth/check', { cache: 'no-store' });
        const j = await r.json();
        rows.push(['Session authenticated', !!j.authenticated, JSON.stringify(j)]);
      } catch (e) {
        rows.push(['Session authenticated', null, 'check failed — ' + e.message]);
      }

      // Conversation
      rows.push(['Conversation ID', !!conversationId, conversationId || 'none yet — will be assigned on first /chat']);

      // Last chat call
      if (lastChat) {
        rows.push(['Last /chat request', lastChat.ok,
          `HTTP ${lastChat.status} · ${lastChat.ms}ms · reply ${lastChat.replyLen} chars · tools=${lastChat.toolCalls} · image=${lastChat.hadImage ? lastChat.imageBytes + 'B' : 'no'}${lastChat.error ? ' · err=' + lastChat.error : ''}`]);
      } else {
        rows.push(['Last /chat request', null, 'no requests yet']);
      }

      // TTS reachability — empty text returns 400 without burning a Deepgram credit
      try {
        const r = await fetch('/voice/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: '' }),
        });
        let detail, state;
        if (r.status === 400)       { detail = 'Deepgram TTS configured · server reachable (use Test TTS to verify audio)'; state = true; }
        else if (r.status === 503)  { detail = 'DEEPGRAM_API_KEY not set — browser SpeechSynthesis fallback in use'; state = null; }
        else if (r.status === 401)  { detail = 'unauthorized — session invalid'; state = false; }
        else                        { detail = `HTTP ${r.status}`; state = r.ok; }
        rows.push(['Server TTS (/voice/speak)', state, detail]);
      } catch (e) {
        rows.push(['Server TTS (/voice/speak)', null, 'unreachable — ' + e.message]);
      }

      // Vision status text (live UI state)
      rows.push(['Vision status (UI)', null, visionStatus.textContent || '(empty)']);

      // UA / size
      rows.push(['User agent', null, navigator.userAgent]);
      rows.push(['Viewport', null, `${window.innerWidth}×${window.innerHeight} · DPR ${window.devicePixelRatio}`]);

      renderDiag(rows);
    }

    document.getElementById('diag-open').onclick = () => {
      diagOverlay.classList.add('open');
      runDiagnostics();
    };
    document.getElementById('diag-close').onclick = () => diagOverlay.classList.remove('open');
    diagOverlay.onclick = (e) => { if (e.target === diagOverlay) diagOverlay.classList.remove('open'); };
    document.getElementById('diag-refresh').onclick = runDiagnostics;

    // Test tone — WebAudio beep, no API cost. Verifies the audio route
    // (BT vs speaker vs silent switch) without involving Deepgram at all.
    document.getElementById('diag-tone').onclick = async () => {
      const btn = document.getElementById('diag-tone');
      const orig = btn.textContent;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        if (ctx.state === 'suspended') await ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
        btn.textContent = 'Playing…';
        setTimeout(() => { btn.textContent = orig; ctx.close(); }, 700);
      } catch (e) {
        btn.textContent = 'Failed';
        console.warn('[diag] tone failed', e);
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    };

    // Test TTS — full Deepgram round-trip via the same speak() the chat uses.
    // Costs one short Deepgram credit.
    document.getElementById('diag-tts').onclick = async () => {
      const btn = document.getElementById('diag-tts');
      const orig = btn.textContent;
      btn.textContent = 'Speaking…';
      try {
        await speak('Audio test. One, two, three.');
        btn.textContent = 'Done';
      } catch (e) {
        btn.textContent = 'Failed';
        console.warn('[diag] tts failed', e);
      }
      setTimeout(() => { btn.textContent = orig; }, 1500);
    };

    document.getElementById('diag-copy').onclick = async () => {
      const text = lastDiagRows.map(([l, s, d]) => `${s === true ? 'OK ' : s === false ? 'FAIL' : '?  '} ${l}${d ? '\n     ' + d : ''}`).join('\n');
      const btn = document.getElementById('diag-copy');
      try {
        await navigator.clipboard.writeText(text);
        const orig = btn.textContent; btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      } catch {
        // Fallback: select a hidden textarea
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1200); } catch {}
        document.body.removeChild(ta);
      }
    };
  </script>
</body>
</html>
